<!DOCTYPE html>
<html>
<head>
    <title>University Admission Form</title>
</head>
<body>

<h2>University Admission Form</h2>

<form>

    <!-- PERSONAL INFO -->
    <fieldset>
        <legend>Personal Information</legend>

        <label>Full Name:</label><br>
        <input type="text" name="fullname" required maxlength="40"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>
    </fieldset>

    <!-- ACADEMIC INFO -->
    <fieldset>
        <legend>Academic Information</legend>

        <label>SSC GPA:</label><br>
        <input type="text" name="ssc" required maxlength="5"><br><br>

        <label>Preferred Department:</label><br>
        <select name="dept" required>
            <option value="">-- Select --</option>
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="BBA">BBA</option>
        </select>
        <br><br>
    </fieldset>

    <!-- DOCUMENTS -->
    <fieldset>
        <legend>Documents</legend>

        <label>Upload Photo:</label><br>
        <input type="file" name="photo" required><br><br>
    </fieldset>

    <br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
